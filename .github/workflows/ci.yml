name: Shadow Runner CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: pip install -r requirements.txt

      - name: Compile the legacy COBOL routine
        run: cobc -m -o interest_calc.so interest_calc.cbl

      - name: Run modern_logic.py unit tests
        run: python -m pytest test_modern_logic.py -v

      - name: Run end-to-end + fuzz/soak verification
        run: python test_e2e_shadow.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t shadow-runner:ci .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name shadow-runner-ci shadow-runner:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          echo
          curl -sf -X POST http://localhost:8000/calculate-interest \
            -H "Content-Type: application/json" \
            -d '{"loan_amount": 1000.00, "interest_rate": 5.00}'
          echo
          sleep 2
          curl -sf http://localhost:8000/shadow-stats
          echo

      - name: Container logs
        if: always()
        run: docker logs shadow-runner-ci

      - name: Stop container
        if: always()
        run: docker stop shadow-runner-ci || true
