name: Shadow Runner CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: pip install -r requirements.txt

      - name: Compile the legacy COBOL routine
        run: cobc -m -o interest_calc.so interest_calc.cbl

      - name: Run modern_logic.py unit tests
        run: python -m pytest test_modern_logic.py -v

      - name: Run end-to-end + fuzz/soak verification
        run: python test_e2e_shadow.py

      - name: Run concurrency stress test
        run: python test_concurrency_stress.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan pinned dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t shadow-runner:ci .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 -e SHADOW_RUNNER_API_KEY=ci-smoke-test-key --name shadow-runner-ci shadow-runner:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          echo
          curl -sf http://localhost:8000/dashboard > /dev/null
          echo "dashboard OK"
          curl -sf -X POST http://localhost:8000/calculate-interest \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ci-smoke-test-key" \
            -d '{"loan_amount": 1000.00, "interest_rate": 5.00}'
          echo
          sleep 2
          curl -sf -H "X-API-Key: ci-smoke-test-key" http://localhost:8000/shadow-stats
          echo
          curl -sf -H "X-API-Key: ci-smoke-test-key" "http://localhost:8000/shadow-history?limit=5"
          echo
          # Unauthenticated request must be rejected, not accepted.
          http_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/calculate-interest \
            -H "Content-Type: application/json" -d '{"loan_amount": 1000.00, "interest_rate": 5.00}')
          if [ "$http_status" != "401" ]; then
            echo "expected 401 for unauthenticated request, got $http_status"
            exit 1
          fi
          echo "auth rejection OK"

      - name: Container logs
        if: always()
        run: docker logs shadow-runner-ci

      - name: Stop container
        if: always()
        run: docker stop shadow-runner-ci || true
