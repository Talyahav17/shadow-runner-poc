name: Shadow Runner CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: pip install -r requirements.txt

      - name: Compile the legacy COBOL routines
        run: |
          cobc -m -o interest_calc.so interest_calc.cbl
          cobc -m -o late_fee_calc.so late_fee_calc.cbl
          cobc -m -o gcd_calc.so gcd_calc.cbl

      - name: Run modern_logic.py unit tests
        run: python -m pytest test_modern_logic.py -v

      - name: Run end-to-end + fuzz/soak verification
        run: python test_e2e_shadow.py

      - name: Run concurrency stress test
        run: python test_concurrency_stress.py

      - name: Dry-run the AI migration pipeline mechanics (no API key, no cost)
        run: python migrate.py --dry-run

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan pinned dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t shadow-runner:ci .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 \
            -e SHADOW_RUNNER_API_KEYS="ci-admin-key:admin,ci-viewer-key:viewer" \
            --name shadow-runner-ci shadow-runner:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          echo
          curl -sf http://localhost:8000/dashboard > /dev/null
          echo "dashboard OK"
          curl -sf http://localhost:8000/migration-dashboard > /dev/null
          echo "migration-dashboard OK"

          # Registry: both programs.yaml entries must be live.
          curl -sf -H "X-API-Key: ci-admin-key" http://localhost:8000/programs
          echo

          # Backward-compat alias.
          curl -sf -X POST http://localhost:8000/calculate-interest \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ci-admin-key" \
            -d '{"loan_amount": 1000.00, "interest_rate": 5.00}'
          echo

          # Generic multi-program endpoint -- the second, differently-shaped program.
          curl -sf -X POST http://localhost:8000/programs/late_fee_calc/calculate \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ci-admin-key" \
            -d '{"inputs": {"balance": 1500.00, "penalty_rate": 2.50}}'
          echo

          # Third program -- signed PIC S9(n) fields, negative input included.
          curl -sf -X POST http://localhost:8000/programs/gcd_calc/calculate \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ci-admin-key" \
            -d '{"inputs": {"a": -49, "b": 14}}' | grep -q '"result":7.0'
          echo "gcd_calc signed-field smoke test OK"
          sleep 2

          curl -sf -H "X-API-Key: ci-admin-key" http://localhost:8000/shadow-stats
          echo
          curl -sf -H "X-API-Key: ci-admin-key" "http://localhost:8000/shadow-history?limit=5"
          echo

          # RBAC: viewer can read but not write, and reads come back masked.
          http_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/calculate-interest \
            -H "Content-Type: application/json" -H "X-API-Key: ci-viewer-key" \
            -d '{"loan_amount": 1000.00, "interest_rate": 5.00}')
          if [ "$http_status" != "403" ]; then
            echo "expected 403 for viewer-role write, got $http_status"
            exit 1
          fi
          echo "RBAC viewer-write rejection OK"
          curl -sf -H "X-API-Key: ci-viewer-key" "http://localhost:8000/shadow-history?limit=1" | grep -q '"masked":true'
          echo "viewer-role masking OK"

          # Unauthenticated request must be rejected, not accepted.
          http_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/calculate-interest \
            -H "Content-Type: application/json" -d '{"loan_amount": 1000.00, "interest_rate": 5.00}')
          if [ "$http_status" != "401" ]; then
            echo "expected 401 for unauthenticated request, got $http_status"
            exit 1
          fi
          echo "auth rejection OK"

          # Prometheus metrics endpoint.
          curl -sf -H "X-API-Key: ci-admin-key" http://localhost:8000/metrics | grep -q "shadow_runner_calculate_requests_total"
          echo "metrics OK"

      - name: Container logs
        if: always()
        run: docker logs shadow-runner-ci

      - name: Stop container
        if: always()
        run: docker stop shadow-runner-ci || true
